[package]
name = "grpc_ingester"
description = "Index a local Yellowstone gRPC feed straight into the DAS database"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "das-grpc-ingester"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
digital_asset_types = { workspace = true, features = ["json_types", "sql_types"] }
futures = { workspace = true }
hyper = { workspace = true, features = ["client", "tcp"] }
program_transformers = { workspace = true }
reqwest = { workspace = true }
sea-orm = { workspace = true, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
serde_json = { workspace = true }
solana-message = { workspace = true }
solana-sdk = { workspace = true }
solana-transaction-status = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter"] }
url = { workspace = true }
# Pinned to the proto the node's plugin speaks (yellowstone-grpc-geyser 15.1.2 -> proto 12.6).
# The proto crate only pulls solana-pubkey, so it coexists with this workspace's solana-sdk 3.x.
yellowstone-grpc-client = "13.3.0"
yellowstone-grpc-proto = "12.6.0"

[lints]
workspace = true
